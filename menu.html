<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メニュー｜SAKANAYA JAPON</title>
  <link rel="icon" href="assets/images/logo.jpg">
  <meta name="description" content="SAKANAYA JAPON のメニュー。刺身・鮮魚・おまかせセット・お惣菜をご用意しています。">

  <!-- ヘッダー・フッター・言語切替は common.css / common.js が担当する。
       ページ固有の見た目だけを下の <style> に書くこと（common.css より後ろなので上書きできる）。 -->
  <link rel="stylesheet" href="assets/css/common.css">
  <script src="assets/js/site-info.js" defer></script>
  <script src="assets/js/common.js" defer></script>

  <style>
    .menu-container {
      max-width: 900px;      /* メニュー画像が見やすい幅に制限 */
      margin: 0 auto;
      background: var(--surface);
      padding-bottom: 40px;
      text-align: center;
    }

    .menu-container h1 {
      padding: 20px;
      font-size: 1.5em;
      color: var(--blue);
      margin: 0;
    }

    .responsive-img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .menu-note {
      padding: 20px;
      font-size: 0.9em;
      color: var(--muted);
      margin: 0;
    }

    /* 右下の注文ボタン（.floating-container / .float-btn）は common.css に集約済み（2026-11-07） */
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <img src="assets/images/logo.jpg" alt="">
      <span class="brand-name">SAKANAYA JAPON</span>
    </a>
    <div class="header-right">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-set-lang="ja" aria-pressed="true">日本語</button>
        <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="biz-link" href="business/index.html"
         data-ja="法人のお客様（飲食店・小売店）" data-en="For Business (restaurants &amp; retailers)">法人のお客様（飲食店・小売店）</a>
    </div>
  </div>
</header>

<main class="menu-container">
  <h1 data-ja="メニュー" data-en="Menu">メニュー</h1>

  <img class="responsive-img" src="assets/images/english-menu20260207.jpg" alt="SAKANAYA JAPON MENU">

  <p class="menu-note"
     data-ja="※画像が拡大できない場合は、長押しして保存するか、LINE・Telegram の注文画面からご確認ください。"
     data-en="If you cannot zoom in, please long-press to save the image, or check the menu in the LINE or Telegram order screen.">
    ※画像が拡大できない場合は、長押しして保存するか、LINE・Telegram の注文画面からご確認ください。
  </p>
</main>

<footer class="site-footer has-float">
  <div class="footer-inner">
    <ul class="footer-links">
      <li><a href="index.html" data-ja="トップ" data-en="Top">トップ</a></li>
      <li><a href="menu.html" data-ja="メニュー" data-en="Menu">メニュー</a></li>
      <li><a href="howto.html" data-ja="ご注文方法" data-en="How to Order">ご注文方法</a></li>
      <li><a href="faq.html" data-ja="よくあるご質問" data-en="FAQ">よくあるご質問</a></li>
      <li><a href="aboutus.html" data-ja="店舗について" data-en="About Us">店舗について</a></li>
      <li><a href="business/index.html" data-ja="法人のお客様" data-en="For Business">法人のお客様</a></li>
    </ul>
    <p class="footer-note">
      SAKANAYA JAPON ／ #72BE0, Street 174, Khan Daun Penh, Phnom Penh, Cambodia
    </p>
  </div>
</footer>

<!-- 右下の注文ボタン（見た目は common.css）。日本語版は LINE が上、英語版は Telegram が上 -->
<div class="floating-container">
  <a href="https://miniapp.line.me/2006469733-lgZj9vJ4" data-info-href="order.lineMiniApp" class="float-btn btn-line" target="_blank" rel="noopener noreferrer">
    <span class="ic">📲</span><span data-ja="LINE で注文" data-en="Order by LINE">LINE で注文</span>
  </a>
  <a href="https://t.me/sakanaya_order_bot/menu" data-info-href="order.telegramOrderApp" class="float-btn btn-tele" target="_blank" rel="noopener noreferrer">
    <span class="ic">✈</span><span data-ja="Telegram で注文" data-en="Order by Telegram">Telegram で注文</span>
  </a>
</div>

</body>
</html>
