  .brand { display: flex; flex-direction: column; min-width: 0; }
  .brand b { font-size: 15px; letter-spacing: .04em; }

  .tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: 76px; background: var(--bg); z-index: 4; scrollbar-width: none; }

  .sec-h small { color: var(--muted); font-size: 12px; }
  .carousel { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }

  .ph { background: var(--soft); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .ph img { width: 100%; height: 100%; object-fit: cover; }

  .pcard .ph { height: 116px; }
  .pbody { padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .pname { font-weight: 700; font-size: 14px; line-height: 1.3; }
  .pnote { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price { font-weight: 700; }
  .usd { font-size: 12px; color: var(--muted); font-weight: 400; }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; padding-top: 6px; }
  .pcard .prow { flex-direction: column; align-items: stretch; gap: 8px; }

  .chip.arrived { background: var(--arr-soft); color: var(--arr-ink); }
  .chip.popular { background: var(--pop-soft); color: var(--pop-ink); }
  .chip.last { background: var(--soft); color: var(--muted); }

  .qc { flex: none; }

  .step span { min-width: 24px; text-align: center; font-weight: 700; }
  .rank { width: 22px; font-weight: 800; color: var(--muted); flex: none; }

  .big { width: 100%; height: 50px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-text); font-size: 15px; font-weight: 700; cursor: pointer; }

  .gift { color: var(--ok); font-weight: 700; }

  @keyframes sp { to { transform: rotate(360deg); } }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }

  .splash .acts { padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }

  .qr { width: 240px; max-width: 80vw; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .copyrow { display: flex; gap: 8px; }
  .copyrow input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); color: var(--text); }

    g.forEach(function (x) { box.appendChild(h('div', null, h('span', null, '🎁 ' + x.label + ' ×' + x.qty), h('span', { class: 'gift' }, t('free')))); });
    box.appendChild(h('div', { class: 'tot' }, h('span', null, t('total')), h('span', null, khr(sub), ' ', h('span', { class: 'usd' }, usd(sub)))));
    var note = S.data.config.deliveryNote[S.lang] || S.data.config.deliveryNote.en;
    if (note) box.appendChild(h('span', { class: 'note' }, '🛵 ' + note));
    return box;
  }

  function cartView() {
    var lines = cartLines();
    var page = h('div', { class: 'page' }, h('h1', null, t('cart')));
    if (!lines.length) {
      page.appendChild(h('p', { class: 'muted' }, t('empty')));
      page.appendChild(h('button', { type: 'button', class: 'big', onclick: function () { S.screen = 'menu'; render(); } }, t('keepShopping')));
      return page;
    }
    lines.forEach(function (l) {
      page.appendChild(h('div', { class: 'line' },
        h('div', { class: 'lm' }, h('b', null, nm(l.it)), l.opt ? h('small', null, '▸ ' + l.opt) : null, h('small', null, khr(l.it.price) + (l.it.unit ? ' · ' + l.it.unit : ''))),
        qtyControl(l.key, true),
        h('span', { class: 'amt' }, khr(l.amount))));
    });
    gifts().forEach(function (g) {
      page.appendChild(h('div', { class: 'line' }, h('div', { class: 'lm' }, h('b', null, '🎁 ' + g.label + ' ×' + g.qty),
        h('small', null, g.kind === 'friend' ? t('giftFriend') : t('giftCredit'))), h('span', { class: 'amt gift' }, t('free'))));
    });
    page.appendChild(totalsBox(false));
    var min = S.data.config.minOrder || 0;
    if (min > 0 && subtotal() < min) page.appendChild(h('div', { class: 'alert' }, t('minOrder') + ': ' + khr(min)));
    page.appendChild(h('button', { type: 'button', class: 'big', disabled: !S.data.orderActive || (min > 0 && subtotal() < min), onclick: function () {
      prefill(); S.screen = 'checkout'; S.alert = ''; S.errors = {}; render(); window.scrollTo(0, 0);
    } }, t('checkout')));
    page.appendChild(h('div', { style: 'height:8px' }));
    page.appendChild(h('button', { type: 'button', class: 'big ghost', onclick: function () { S.screen = 'menu'; render(); } }, t('keepShopping')));
    return page;
  }

  function prefill() {
    var c = S.data.customer, f = S.form, saved = load('form') || {};
    if (f.name === undefined) f.name = saved.name || c.name || [tgUser && tgUser.first_name, tgUser && tgUser.last_name].filter(Boolean).join(' ');
    if (f.phone === undefined) f.phone = saved.phone || c.phone || '';
    if (f.address === undefined) f.address = saved.address || c.address || '';
    if (f.map === undefined) f.map = saved.map || c.map || '';
    if (!f.type) f.type = 'Delivery';
    if (!f.payment) f.payment = S.data.config.payments[0] || 'KHQR';
    var dates = availDates();
    if (!f.date || !dates.some(function (d) { return d.key === f.date; })) f.date = dates.length ? dates[0].key : '';
    var d = dates.filter(function (x) { return x.key === f.date; })[0];
    if (!d || !d.slots.some(function (s) { return s.id === f.slot; })) f.slot = '';
  }

  function field(id, label, input, err, hint) {
    return h('div', { class: 'field' + (err ? ' bad' : '') }, h('label', { for: id }, label), input,
      err ? h('span', { class: 'err', id: id + '-err' }, err) : null, hint ? h('span', { class: 'note', id: id + '-hint' }, hint) : null);
  }

  function checkoutView() {
    var f = S.form, e = S.errors, c = S.data.config;
    var page = h('div', { class: 'page' }, h('h1', null, t('details')));
    if (S.alert) page.appendChild(h('div', { class: 'alert', role: 'alert' }, S.alert));
    var bind = function (k) { return function (ev) { f[k] = ev.target.value; store('form', { name: f.name, phone: f.phone, address: f.address, map: f.map }); if (e[k]) { delete e[k]; ev.target.closest('.field').classList.remove('bad'); var er = ev.target.closest('.field').querySelector('.err'); if (er) er.remove(); } }; };
    page.appendChild(field('f-name', t('name'), h('input', { id: 'f-name', type: 'text', autocomplete: 'name', maxlength: '60', value: f.name || '', oninput: bind('name') }), e.name));
    page.appendChild(field('f-phone', t('phone'), h('input', { id: 'f-phone', type: 'tel', autocomplete: 'tel', inputmode: 'tel', maxlength: '20', placeholder: '012 345 678', value: f.phone || '', oninput: bind('phone') }), e.phone));
    if (c.pickup) {
      page.appendChild(h('div', { class: 'field' }, h('span', { class: 'lbl' }, t('how')), h('div', { class: 'seg' }, ['Delivery', 'Pick up'].map(function (v) {
        return h('button', { type: 'button', 'aria-pressed': f.type === v ? 'true' : 'false', onclick: function () { f.type = v; render(); } }, v === 'Delivery' ? t('delivery') : t('pickup'));
      }))));
    }
    if (f.type === 'Delivery') {
      page.appendChild(field('f-addr', t('address'), h('textarea', { id: 'f-addr', maxlength: '300', placeholder: t('addressPh'), oninput: bind('address') }, f.address || ''), e.address));
      page.appendChild(field('f-map', t('map'), h('input', { id: 'f-map', type: 'url', inputmode: 'url', maxlength: '300', placeholder: 'https://maps.app.goo.gl/…', value: f.map || '', oninput: bind('map') }), e.map));
    } else if (c.pickupAddress || c.pickupMap) {
      var pbox = h('div', { class: 'field' }, h('span', { class: 'lbl' }, t('pickupAt')));
      if (c.pickupAddress) pbox.appendChild(h('span', { class: 'note' }, '📍 ' + c.pickupAddress));
      if (c.pickupMap) pbox.appendChild(h('button', { type: 'button', class: 'big ghost', onclick: function () { openExternal(c.pickupMap); } }, '🗺 ' + t('openMap')));
      page.appendChild(pbox);
    }
    prefill(); // カートの準備時間で選べる日・時間が変わるので、毎回たしかめる
    var dates = availDates();
    var li = leadItems();
    if (li.length) page.appendChild(h('div', { class: 'banner' }, '⏱ ', t('leadNote')(li.map(nm).join(', '), Math.ceil(Math.max.apply(null, li.map(function (x) { return x.lead; })) / 60))));
    if (!dates.length) page.appendChild(h('div', { class: 'alert' }, t('noDates')));
    else {
      var dsel = h('select', { id: 'f-date', onchange: function (ev) { f.date = ev.target.value; f.slot = ''; render(); } },
        dates.map(function (d) { return h('option', { value: d.key, selected: d.key === f.date }, dateLabel(d.key)); }));
      page.appendChild(field('f-date', t('date'), dsel));
      var day = dates.filter(function (d) { return d.key === f.date; })[0] || dates[0];
      if (c.timeMode === 'time' || day.slots.length > 6) {
        var tg2 = h('div', { class: 'tgrid', id: 'f-slot', role: 'radiogroup', 'aria-label': t('timeRecv') }, day.slots.map(function (s) {
          return h('button', { type: 'button', role: 'radio', 'aria-checked': f.slot === s.id ? 'true' : 'false', 'aria-pressed': f.slot === s.id ? 'true' : 'false', 'data-slot': s.id,
            onclick: function () { f.slot = s.id; delete e.slot; render(); } }, s.label);
        }));
        page.appendChild(h('div', { class: 'field' + (e.slot ? ' bad' : '') }, h('span', { class: 'lbl' }, c.timeMode === 'time' ? t('timeRecv') : t('time')), tg2,
          e.slot ? h('span', { class: 'err' }, e.slot) : null,
          c.timeMode === 'time' && c.leadMinutes ? h('span', { class: 'note', id: 'f-slot-hint' }, t('leadHint')(c.leadMinutes)) : null));
      } else {
        page.appendChild(h('div', { class: 'field' + (e.slot ? ' bad' : '') }, h('span', { class: 'lbl' }, t('time')),
          h('div', { class: 'seg' }, day.slots.map(function (s) {
            return h('button', { type: 'button', 'aria-pressed': f.slot === s.id ? 'true' : 'false', onclick: function () { f.slot = s.id; delete e.slot; render(); } }, s.label);
          })), e.slot ? h('span', { class: 'err' }, e.slot) : null));
      }
    }
    page.appendChild(h('div', { class: 'field' }, h('span', { class: 'lbl' }, t('payment')), h('div', { class: 'seg' }, c.payments.map(function (p) {
      return h('button', { type: 'button', 'aria-pressed': f.payment === p ? 'true' : 'false', onclick: function () { f.payment = p; render(); } }, p === 'KHQR' ? t('khqr') : t('cash'));
    }))));
    var abox = h('div', { class: 'field' + (e.allergy ? ' bad' : ''), id: 'f-allergy' }, h('span', { class: 'lbl' }, t('allergyQ') + (c.allergyRequired ? ' *' : '')),
      h('div', { class: 'seg', role: 'radiogroup', 'aria-label': t('allergyQ') }, [['none', t('allergyNo')], ['yes', t('allergyYes')]].map(function (o) {
        return h('button', { type: 'button', role: 'radio', 'aria-checked': f.allergy === o[0] ? 'true' : 'false', 'aria-pressed': f.allergy === o[0] ? 'true' : 'false',
          onclick: function () { f.allergy = o[0]; delete e.allergy; render(); if (o[0] === 'yes') { var ta = document.getElementById('f-allergy-text'); if (ta) ta.focus(); } } }, o[1]);
      })));
    if (f.allergy === 'yes') abox.appendChild(h('textarea', { id: 'f-allergy-text', maxlength: '200', placeholder: t('allergyPh'), 'aria-label': t('allergyQ'), oninput: bind('allergyText') }, f.allergyText || ''));
    if (e.allergy) abox.appendChild(h('span', { class: 'err' }, e.allergy));
    page.appendChild(abox);
    page.appendChild(field('f-note', t('note'), h('textarea', { id: 'f-note', maxlength: '300', oninput: bind('note') }, f.note || '')));
    page.appendChild(totalsBox());
    var btn = h('button', { type: 'button', class: 'big', disabled: S.submitting || !dates.length, onclick: submit }, S.submitting ? t('placing') : t('placeOrder') + ' · ' + khr(subtotal()));
    page.appendChild(btn);
    return page;
  }

  function validate() {
    var f = S.form, e = {};
    if (!String(f.name || '').trim()) e.name = t('required');
    if (String(f.phone || '').replace(/\D/g, '').length < 8) e.phone = t('badPhone');
    if (f.type === 'Delivery' && String(f.address || '').trim().length < 5) e.address = t('badAddress');
    if (f.map && !/^https:\/\//i.test(String(f.map).trim())) e.map = 'https://…';
    if (!f.slot) e.slot = t('chooseTime');
    if (f.allergy === 'yes' && String(f.allergyText || '').trim().length < 2) e.allergy = t('allergyTextErr');
    else if (!f.allergy && S.data.config.allergyRequired) e.allergy = t('allergyErr');
    S.errors = e;
    return !Object.keys(e).length;
  }

  function submit() {
    if (S.submitting) return;
    if (!validate()) { S.alert = ''; render(); var bad = document.querySelector('.field.bad input, .field.bad textarea, .field.bad'); if (bad && bad.focus) bad.focus(); if (bad && bad.scrollIntoView) bad.scrollIntoView({ block: 'center' }); return; }
    S.submitting = true; S.alert = ''; render();
    var go = function (writeAccess) {
      var f = S.form;
      var order = {
        clientOrderId: S.clientOrderId,
        cart: Object.keys(S.cart).map(function (k) { var o = { code: codeOf(k), qty: S.cart[k] }; if (optOf(k)) o.opt = optOf(k); return o; }),
        name: String(f.name).trim(), phone: String(f.phone).trim(), type: f.type, address: String(f.address || '').trim(),
        map: String(f.map || '').trim(), date: f.date, slot: f.slot, payment: f.payment, note: String(f.note || '').trim(),
        allergy: f.allergy || '', allergyText: f.allergy === 'yes' ? String(f.allergyText || '').trim() : '',
        useCredit: true, writeAccess: !!writeAccess, lang: S.lang
      };
      api({ a: 'order', order: order }, 45000).then(function (r) {
        S.submitting = false;
        if (r && r.ok) {
          S.result = r; S.cart = {}; store('cart', { cart: {}, ts: Date.now() });
          S.screen = 'done';
          try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
          render(); window.scrollTo(0, 0); return;
        }
        handleOrderError(r || { code: 'server' });
      }, function () {
        S.submitting = false; S.alert = te('network'); render(); window.scrollTo(0, 0);
      });
    };
    try {
      if (tg && tg.requestWriteAccess && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) tg.requestWriteAccess(function (ok) { go(ok); });
      else go(false);
    } catch (e) { go(false); }
  }

  function handleOrderError(r) {
    var code = r.code || 'server';
    if (code === 'item_unavailable' && Array.isArray(r.detail)) {
      Object.keys(S.cart).forEach(function (k) { if (r.detail.indexOf(codeOf(k)) >= 0) delete S.cart[k]; });
      r.detail.forEach(function (c) { var it = item(c); if (it) it.soldOut = true; });
      store('cart', { cart: S.cart, ts: Date.now() });
      S.alert = te('item_unavailable') + ' ' + r.detail.map(function (c) { var it = item(c); return it ? nm(it) : c; }).join(', ');
      S.clientOrderId = newId();
    } else if (code === 'slot') {
      S.alert = te('slot'); S.form.slot = '';
      S.clientOrderId = newId();
      reloadDates();
    } else if (code === 'name' || code === 'phone' || code === 'address' || code === 'allergy') {
      S.errors[code] = te(code); S.alert = '';
    } else if (code === 'min_order') {
      S.alert = te('min_order') + (r.detail ? ' (' + khr(r.detail) + ')' : '');
    } else {
      S.alert = te(code);
      if (code === 'invalid') S.clientOrderId = newId();
    }
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error'); } catch (e) {}
    if (!cartCount()) { S.screen = 'cart'; }
    render(); window.scrollTo(0, 0);
  }

  function reloadDates() {
    api({ a: 'boot' }, 30000).then(function (r) { if (r && r.ok) { S.data.dates = r.dates; S.data.now = r.now; S.bootAt = Date.now(); prefill(); render(); } }, function () {});
  }

  function doneView() {
    var r = S.result, page = h('div', { class: 'page' });
    page.appendChild(h('div', { class: 'center', style: 'min-height:auto;padding:24px 0 8px' }, h('div', { class: 'done-ok', 'aria-hidden': 'true' }, '✓'),
      h('h1', { style: 'margin:0' }, t('orderReceived')), h('div', { class: 'muted' }, t('orderNo') + ' ' + r.orderNo)));
    var sum = h('div', { class: 'sum' },
      h('div', null, h('span', null, r.type === 'Delivery' ? t('when') : t('whenPickup')), h('span', null, dateLabel(r.date) + ', ' + r.slot)),
      r.allergy ? h('div', null, h('span', null, t('allergyQ')), h('span', null, r.allergy === 'none' ? t('allergyNo') : r.allergy)) : null,
      (r.gifts || []).map(function (g) { var it = item(g.code); return h('div', null, h('span', null, '🎁 ' + (it ? nm(it) : g.code) + ' ×' + g.qty), h('span', { class: 'gift' }, t('free'))); }),
      h('div', { class: 'tot' }, h('span', null, t('total')), h('span', null, khr(r.total), ' ', h('span', { class: 'usd' }, usd(r.total)))));
    page.appendChild(sum);
    if (r.ref === 'not_new' || r.ref === 'self') page.appendChild(h('p', { class: 'note' }, 'ℹ️ ' + t('notNew')));
    if (r.type === 'Delivery') page.appendChild(h('p', { class: 'note' }, '🛵 ' + (S.data.config.deliveryNote[S.lang] || S.data.config.deliveryNote.en)));
    if (r.payment === 'KHQR') {
      page.appendChild(h('p', null, t('payWithQr')));
      if (r.paymentQr) page.appendChild(h('div', { class: 'center', style: 'min-height:auto;padding:0' }, h('img', { class: 'qr', src: r.paymentQr, alt: 'KHQR' })));
      if (r.paymentAccount) page.appendChild(h('p', { class: 'note', style: 'text-align:center' }, t('account') + ': ' + r.paymentAccount));
    } else page.appendChild(h('p', null, t('payCash')));
    if (S.data.config.referral) {
      if (r.refCode) S.data.customer.refLink = S.data.config.miniAppLink + '?startapp=ref_' + r.refCode;
      page.appendChild(h('div', { class: 'invite-card', style: 'margin:16px 0' }, h('div', null, h('b', null, '🎁 ' + t('inviteTitle')), t('inviteBody')),
        h('button', { type: 'button', class: 'add sm', onclick: function () { S.overlay = 'invite'; render(); } }, t('share'))));
    }
    page.appendChild(h('button', { type: 'button', class: 'big ghost', onclick: function () {
      S.screen = 'menu'; S.result = null; S.clientOrderId = newId(); S.form.note = ''; S.tab = 'today';
      if (S.data.customer.friendGift) S.data.customer.friendGift = false;
      if (r.gifts && r.gifts.some(function (g) { return g.kind === 'credit'; })) S.data.customer.credits = Math.max(0, S.data.customer.credits - 1);
      render(); window.scrollTo(0, 0);
    } }, t('backToMenu')));
    if (S.overlay === 'invite') page.appendChild(inviteView());
    return page;
  }

  function errorView() {
    var box = h('div', { class: 'center' }, h('div', { style: 'font-size:40px', 'aria-hidden': 'true' }, '🐟'), h('p', null, S.error));
    if (!initData) box.appendChild(h('a', { class: 'big', href: BOT_LINK, style: 'display:flex;align-items:center;justify-content:center;text-decoration:none;max-width:280px' }, t('openTg')));
    else box.appendChild(h('button', { type: 'button', class: 'big', style: 'max-width:280px', onclick: boot }, t('retry')));
    box.appendChild(h('div', { class: 'ver' }, 'v' + APP_VERSION));
    return box;
  }

  /* ===================== 日付 ===================== */
  function todayKey() { return (S.data && S.data.now) ? S.data.now.slice(0, 10) : new Date().toISOString().slice(0, 10); }
  function dateLabel(key) {
    var d = new Date(key + 'T12:00:00+07:00');
    var tk = todayKey(); var tomorrow = new Date(new Date(tk + 'T12:00:00+07:00').getTime() + 86400000).toISOString().slice(0, 10);
    var loc = S.lang === 'km' ? 'km-KH' : (S.lang === 'ja' ? 'ja-JP' : 'en-GB');
    var s;
    try { s = new Intl.DateTimeFormat(loc, { weekday: 'short', day: 'numeric', month: 'short', timeZone: TZ }).format(d); } catch (e) { s = key; }
    if (key === tk) return t('todayLbl') + ' · ' + s;
    if (key === tomorrow) return t('tomorrow') + ' · ' + s;
    return s;
  }

  /* ===================== 通信 ===================== */
  function api(body, timeoutMs) {
    body.initData = initData;
    return new Promise(function (resolve, reject) {
      var done = false;
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = setTimeout(function () { if (done) return; done = true; try { ctrl && ctrl.abort(); } catch (e) {} reject(new Error('timeout')); }, timeoutMs || 30000);
      fetch(API_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
        .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .then(function (j) { if (done) return; done = true; clearTimeout(timer); resolve(j); },
              function (e) { if (done) return; done = true; clearTimeout(timer); reject(e); });
    });
  }

  function boot() {
    S.screen = 'loading'; render();
    if (!initData) { S.screen = 'error'; S.error = t('openInTg'); render(); return; }
    api({ a: 'boot' }, 30000).then(function (r) {
      if (!r || !r.ok) { S.screen = 'error'; S.error = te((r && r.code) || 'server'); render(); return; }
      // 画面が古い（Telegram の中に前の版が残っている）ときは、1回だけ読み直す。#tgWebAppData はそのまま
      var want = Number(r.config && r.config.appVersion) || 0;
      if (want > APP_VERSION) {
        var flag = 'tgb_reload_' + want, tried = false;
        try { tried = sessionStorage.getItem(flag) === '1'; sessionStorage.setItem(flag, '1'); } catch (e) { tried = true; }
        if (!tried) { location.replace(location.pathname + '?v=' + want + location.hash); return; }
      }
      S.data = r; S.bootAt = Date.now();
      var savedLang = load('lang'); S.lang = savedLang || r.lang || S.lang;
      var saved = load('cart');
      S.cart = {};
      if (saved && saved.cart && Date.now() - (saved.ts || 0) < 2 * 86400000) {
        Object.keys(saved.cart).forEach(function (k) { if (validKey(k) && saved.cart[k] > 0) S.cart[k] = Math.min(saved.cart[k], 50); });
      }
      S.screen = 'menu';
      var p = r.menu.picks[0];
      if (r.config.splash && p && item(p.code) && !item(p.code).soldOut && load('splash') !== todayKey()) S.overlay = 'splash';
      render();
    }, function () { S.screen = 'error'; S.error = te('network'); render(); });
  }

  /* ===================== 起動 ===================== */
  try {
    if (tg) {
      tg.ready(); tg.expand();
      if (tg.colorScheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      try { tg.setHeaderColor(tg.colorScheme === 'dark' ? '#111418' : '#ffffff'); tg.setBackgroundColor(tg.colorScheme === 'dark' ? '#111418' : '#ffffff'); } catch (e) {}
      if (tg.BackButton) tg.BackButton.onClick(function () {
        if (S.overlay) { if (S.overlay === 'splash') store('splash', todayKey()); S.overlay = null; }
        else if (S.screen === 'checkout') S.screen = 'cart';
        else if (S.screen === 'cart') S.screen = 'menu';
        render();
      });
    }
  } catch (e) {}
  boot();
})();
</script>
